
{% extends 'base.html' %}

{% block title %}music | MyTube{% endblock %}

{% block content %}

<h1>Welcome to Music</h1>

<p style="margin: 15px 0;">
    This is the dynamic content area.
</p>

<div style="
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 25px;
">

    {% for i in "123456789" %}

    <div style="
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    ">

        <div style="
            height: 140px;
            background: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        ">
            ▶
        </div>

        <div style="padding: 15px;">
            <h3>Video {{ forloop.counter }}</h3>
            <p>Sample video description</p>
        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
